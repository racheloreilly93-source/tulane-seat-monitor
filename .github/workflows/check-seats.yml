name: Tulane Seat Monitor

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification"
        type: boolean
        default: false
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: seat-monitor
  cancel-in-progress: false

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python monitor.py

      - name: Save state
        if: success()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "seat-monitor-bot"
            git config user.email "seat-monitor-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update seat state [skip ci]"
            git push
          fi
